<h1>Drive Upload Helper</h1>
<p>A small personal tool that uploads files to the signed-in user's own Google Drive.</p>
<ul>
  <li>It only uses the <code>drive.file</code> permission, so it can see only the files it creates.</li>
  <li>It cannot read or change any other files in your Drive.</li>
</ul>
